name: verify

# Runs exactly what ./scripts/verify.sh runs locally. Same script, same result —
# so a green run on your machine is a green run here, with no CI-only surprises.
#
# What this cannot check: whether the MQL5 compiles. MetaEditor is Windows-only and
# is not redistributable, so there is no runner for it. Tracked as F-1 in
# docs/tests/findings.md rather than faked with a green check.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: docs, links, and template consistency
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run verification
        run: ./scripts/verify.sh

  secrets:
    name: no credentials committed
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks needs history to scan commits, not just the tree.
          fetch-depth: 0

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
