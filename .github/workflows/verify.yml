name: verify

# Runs exactly what ./scripts/verify.sh runs locally. Same script, same result —
# so a green run on your machine is a green run here, with no CI-only surprises.
#
# What this cannot check: whether the MQL5 compiles. MetaEditor is Windows-only and
# is not redistributable, so there is no runner for it. Tracked as F-1 in
# docs/tests/findings.md rather than faked with a green check.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: docs, links, and template consistency
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run verification
        run: ./scripts/verify.sh

  secrets:
    name: no credentials committed
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks scans commits, not just the working tree.
          fetch-depth: 0

      # The gitleaks *CLI* is MIT and free. The gitleaks-action wrapper requires a
      # paid license for repositories owned by an organization, which this one is —
      # it failed with "missing gitleaks license" on the first CI run. Running the
      # binary directly keeps the scan and drops the licensing problem.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.28.0
        run: |
          set -euo pipefail
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan history for secrets
        run: gitleaks git --no-banner --redact --verbose .
